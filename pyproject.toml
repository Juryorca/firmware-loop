[project]
name = "fwcore"
version = "0.3.0"
description = "Firmware research agent framework core: authoritative domain state, open tool registry, resumable runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fw-core = "fwcore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fwcore"]
