[project]
name = "fwcore"
version = "0.3.0"
description = "Firmware research agent framework core: authoritative domain state, open tool registry, resumable runtime"
requires-python = ">=3.10"
dependencies = ["quickjs>=1.19"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tui = ["textual>=8.0"]

[project.scripts]
fw-core = "fwcore.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fwcore", "fwapp", "fwapp.modes", "fwapp.widgets"]

[tool.setuptools.package-data]
fwcore = ["prompts/*.md"]
